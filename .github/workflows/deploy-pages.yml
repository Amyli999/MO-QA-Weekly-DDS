name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build static artifact with cache-busted assets
        run: python scripts/build_pages.py

      - name: Write custom domain CNAME (optional)
        if: ${{ vars.PAGES_CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.PAGES_CUSTOM_DOMAIN }}" > .site/CNAME

      - name: Keep repository CNAME if present
        if: ${{ vars.PAGES_CUSTOM_DOMAIN == '' && hashFiles('CNAME') != '' }}
        run: cp CNAME .site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
