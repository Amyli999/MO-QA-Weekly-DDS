<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Plan</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">CN MO QA Weekly DDS</p>
                <h1>Master Plan</h1>
                <p class="subtitle">This page can be expanded later with the broader milestone or program view.</p>
            </div>
        </header>

        <nav class="top-nav">
            <a href="../index.html">DDS Dashboard</a>
            <a class="active" href="masterplan.html">Master Plan</a>
            <a id="admin-nav-link" href="admin.html">Admin</a>
        </nav>

        <div id="page-access-message" class="permission-banner"></div>

        <section class="card">
            <h2>Upcoming plan</h2>
            <p>Use this area to connect the weekly DDS page with a larger masterplan view.</p>
        </section>
    </div>

    <script src="../cloud-config.js?v=20260727a"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        async function guardAdminNav() {
            const link = document.getElementById('admin-nav-link');
            if (!link) return;

            const cfg = window.DDS_CLOUD_CONFIG || {};
            const requiresGuard = Boolean(cfg.enabled && cfg.requireAuth && cfg.baseUrl && cfg.anonKey);
            if (!requiresGuard || !window.supabase || typeof window.supabase.createClient !== 'function') return;

            const client = window.supabase.createClient(String(cfg.baseUrl).replace(/\/$/, ''), cfg.anonKey);
            const { data: sessionData } = await client.auth.getSession();
            const accessToken = sessionData?.session?.access_token || '';
            const email = String(sessionData?.session?.user?.email || '').toLowerCase();

            let allowAdmin = false;
            if (accessToken && email) {
                const url = `${String(cfg.baseUrl).replace(/\/$/, '')}/rest/v1/dds_workspace_members?select=role&workspace_id=eq.${encodeURIComponent(String(cfg.workspaceId || 'cn-mo-qa-default'))}&email=eq.${encodeURIComponent(email)}`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        apikey: cfg.anonKey,
                        Authorization: `Bearer ${accessToken}`
                    }
                });
                if (response.ok) {
                    const rows = await response.json();
                    allowAdmin = Array.isArray(rows) && rows[0]?.role === 'admin';
                }
            }

            if (!allowAdmin) {
                link.classList.add('nav-disabled');
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    const msg = document.getElementById('page-access-message');
                    if (msg) msg.textContent = 'need access';
                });
            }
        }

        guardAdminNav().catch(() => null);
    </script>
</body>
</html>
